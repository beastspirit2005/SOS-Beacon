<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Beacon | Citizen Emergency SOS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚨</text></svg>">
    <link rel="stylesheet" href="/static/css/index.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #090d16; color: #f3f4f6; margin: 0; padding: 1rem; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .sos-card { background: rgba(17, 24, 39, 0.95); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 20px; padding: 2rem; width: 100%; max-width: 450px; box-shadow: 0 20px 50px rgba(239, 68, 68, 0.15); text-align: center; }
        
        .sos-btn-wrapper { position: relative; width: 180px; height: 180px; margin: 2rem auto; }
        .sos-btn { width: 100%; height: 100%; border-radius: 50%; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); border: 4px solid #fca5a5; color: white; font-size: 2.2rem; font-weight: 800; cursor: pointer; box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4); transition: transform 0.2s ease, box-shadow 0.2s ease; outline: none; }
        .sos-btn:active { transform: scale(0.95); }
        .sos-btn-pulse { position: absolute; top: -10px; left: -10px; right: -10px; bottom: -10px; border-radius: 50%; border: 2px solid #ef4444; animation: pulse 2s infinite; pointer-events: none; }
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }

        .timeline-tracker { margin-top: 2rem; border-top: 1px solid #1e293b; padding-top: 1.5rem; text-align: left; }
        .timeline-step { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; font-size: 0.9rem; color: #64748b; }
        .timeline-step.active { color: #38bdf8; font-weight: 600; }
        .timeline-step.completed { color: #2de1c4; }
        .step-icon { width: 24px; height: 24px; border-radius: 50%; border: 2px solid currentColor; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; }
        
        .cancel-box { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; border-radius: 12px; padding: 1rem; margin-top: 1rem; display: none; }
        .cancel-btn { background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="sos-card">
        <h2 style="color: #f8fafc; margin: 0 0 0.5rem;">BEACON SOS</h2>
        <p style="color: #94a3b8; font-size: 0.9rem; margin: 0;">Offline Emergency Mesh Broadcast</p>

        <div class="sos-btn-wrapper">
            <div class="sos-btn-pulse"></div>
            <button id="sosButton" onclick="triggerSos()" class="sos-btn">SOS</button>
        </div>

        <textarea id="payloadText" placeholder="Emergency description (e.g. Trapped near flooded road, need medical assistance)" style="width: 100%; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 0.75rem; border-radius: 8px; font-family: inherit; margin-bottom: 1rem; box-sizing: border-box; resize: vertical;" rows="3"></textarea>

        <div id="cancelBox" class="cancel-box">
            <span style="color: #fca5a5; font-size: 0.85rem;">Emergency Signal Initiated. Cancel window active: <span id="countdown">5</span>s</span>
            <br>
            <button onclick="cancelSos()" class="cancel-btn">CANCEL EMERGENCY</button>
        </div>

        <div class="timeline-tracker">
            <h4 style="color: #cbd5e1; margin: 0 0 1rem; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;">Transmission Lifecycle</h4>
            <div class="timeline-step" id="step1"><div class="step-icon">1</div> SOS Created & Signed</div>
            <div class="timeline-step" id="step2"><div class="step-icon">2</div> Mesh Peer Broadcast</div>
            <div class="timeline-step" id="step3"><div class="step-icon">3</div> Ingested by Gateway</div>
            <div class="timeline-step" id="step4"><div class="step-icon">4</div> Cloud Backend & AI Triage</div>
            <div class="timeline-step" id="step5"><div class="step-icon">5</div> Officer Responding</div>
        </div>
    </div>

    <script src="/static/js/victim.js"></script>
</body>
</html>
