<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Beacon | Officer Tactical Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="/static/css/index.css?v=3.0">
    <style>
        body {
            overflow-y: auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .main-layout {
            display: flex;
            height: calc(100vh - 65px);
            position: relative;
            z-index: 1;
        }

        .sidebar {
            width: 440px;
            background: rgba(5, 8, 12, 0.92);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: var(--space-padding);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .incident-list {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-padding);
            display: flex;
            flex-direction: column;
            gap: var(--space-gap);
        }

        .map-view {
            flex: 1;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #030507;
        }

        .incident-card {
            background: var(--surface-base);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: var(--space-padding-sm);
            transition: all var(--ease-card);
        }

        .incident-card:hover {
            border-color: var(--border-active);
            box-shadow: var(--glow-subtle);
        }

        .incident-card.priority-5, .incident-card.priority-4 {
            border-left: 4px solid var(--color-red);
        }

        .incident-card.priority-3 {
            border-left: 4px solid var(--color-orange);
        }

        .incident-card.priority-2, .incident-card.priority-1 {
            border-left: 4px solid var(--color-green);
        }
    </style>
</head>
<body>

    <!-- Enterprise Top Navigation Bar with Fancy Glassmorphic Pill Tabs -->
    <nav class="beacon-navbar">
        <a href="landing.html" class="beacon-brand">
            <div class="beacon-logo-icon">🛡️</div>
            <span class="beacon-brand-name">PROJECT BEACON</span>
        </a>

        <div class="beacon-nav-links">
            <a href="landing.html" class="beacon-nav-item">📊 Overview</a>
            <a href="victim.html" class="beacon-nav-item">🚨 Citizen SOS</a>
            <a href="officer.html" class="beacon-nav-item active">🛡️ Officer Command</a>
            <a href="admin.html" class="beacon-nav-item">⚙️ National Admin</a>
        </div>

        <div>
            <a href="login.html" class="btn-auth-blue">
                🔑 Login / Auth
            </a>
        </div>
    </nav>

    <div class="main-layout">
        <!-- Sidebar Incident Queue -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div>
                    <h3 style="margin: 0; font-size: 1.05rem; color: var(--text-primary); font-weight: 700;">
                        Priority Emergency Queue
                    </h3>
                    <p style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">
                        Real-time AI Triage Feed
                    </p>
                </div>
                <span id="queueCount" class="beacon-status-pill" style="font-size: 0.75rem;">
                    0 Active
                </span>
            </div>

            <div class="incident-list" id="incidentList">
                <div style="text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
                    <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">📡</div>
                    <p style="font-size: 0.9rem;">Monitoring Gateway Ingestion Streams...</p>
                    <p style="font-size: 0.78rem; color: var(--text-muted); margin-top: 4px;">Active emergency broadcasts will stream here automatically.</p>
                </div>
            </div>
        </div>

        <!-- Leaflet Map View -->
        <div class="map-view">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="/static/js/mesh-bg.js?v=3.0"></script>
        <script src="/static/js/officer.js?v=3.0"></script>
</body>
</html>
