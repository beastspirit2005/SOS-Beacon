<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Beacon | Officer Tactical Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="/static/css/index.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0b0f19; color: #f3f4f6; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .header { background: #111827; border-bottom: 1px solid #1e293b; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .brand-title { font-size: 1.25rem; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 0.5rem; }
        .badge-officer { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid #38bdf8; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; }
        
        .main-layout { display: flex; flex: 1; height: calc(100vh - 60px); }
        .sidebar { width: 380px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; }
        .sidebar-header { padding: 1rem; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .incident-list { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
        
        .map-view { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; background: #020617; }
        
        .incident-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 1rem; transition: border-color 0.2s; }
        .incident-card.priority-5, .incident-card.priority-4 { border-left: 4px solid #ef4444; }
        .incident-card.priority-3 { border-left: 4px solid #f59e0b; }
        .severity-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .severity-CRITICAL { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
        
        .btn-dispatch { background: #2de1c4; color: #0f172a; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.8rem; }
        .btn-dispatch:hover { background: #22c55e; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand-title">
            <span>PROJECT BEACON</span>
            <span class="badge-officer">TACTICAL COMMAND</span>
        </div>
        <div style="display: flex; align-items: center; gap: 1rem;">
            <span id="officerIdentity" style="font-size: 0.85rem; color: #94a3b8;">Responder Portal</span>
            <button onclick="requestLogin()" class="btn-dispatch" style="background: #38bdf8;">Login / Auth</button>
        </div>
    </div>

    <div class="main-layout">
        <div class="sidebar">
            <div class="sidebar-header">
                <h3 style="margin: 0; font-size: 1rem; color: #f8fafc;">Priority Incidents</h3>
                <span id="queueCount" style="background: #1e293b; color: #38bdf8; padding: 2px 8px; border-radius: 12px; font-size: 0.8rem; font-family: monospace;">0 Active</span>
            </div>
            <div class="incident-list" id="incidentList">
                <p style="color: #64748b; font-size: 0.85rem; text-align: center;">Waiting for active emergency broadcasts...</p>
            </div>
        </div>
        
        <div class="map-view">
            <div id="map"></div>
        </div>
    </div>

    <audio id="alertSound" src="https://assets.mixkit.co/sfx/preview/mixkit-software-interface-start-2574.mp3" preload="auto"></audio>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="/static/js/officer.js"></script>
</body>
</html>
