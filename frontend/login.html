<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Beacon | Secure Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f3f4f6; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .auth-container { max-width: 400px; margin: 4rem auto; background: rgba(5, 8, 12, 0.7); backdrop-filter: blur(10px); padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border-subtle); box-shadow: var(--glow-medium); }
        .auth-container h2 { text-align: center; color: var(--text-primary); font-family: var(--font-mono); margin-bottom: 2rem; }
        .auth-form-group { margin-bottom: 1.5rem; }
        .auth-form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; }
        .auth-form-group input { width: 100%; box-sizing: border-box; padding: 0.75rem; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-subtle); border-radius: 6px; color: var(--text-primary); font-family: var(--font-mono); }
        .auth-form-group input:focus { outline: none; border-color: var(--color-cyan); box-shadow: 0 0 0 2px rgba(45, 225, 196, 0.2); }
        .auth-btn { width: 100%; padding: 0.85rem; background: linear-gradient(135deg, var(--color-cyan), var(--color-green)); border: none; border-radius: 6px; color: #000; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
        .auth-btn:hover { opacity: 0.9; }
        .auth-link { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; }
        .auth-link a { color: var(--color-cyan); text-decoration: none; }
        .auth-link a:hover { text-decoration: underline; }
        #loginMsg { margin-top: 1rem; text-align: center; font-size: 0.85rem; }
        .error { color: var(--color-red); }
        .success { color: var(--color-green); }
    </style>
</head>
<body>
    <nav class="beacon-navbar">
        <a href="landing.html" class="beacon-brand">
            <div class="beacon-logo-icon">🛡️</div>
            <span class="beacon-brand-name">PROJECT BEACON</span>
        </a>
    </nav>

    <div class="app-container" style="flex: 1;">
        <div class="auth-container">
            <h2>OFFICIAL LOGIN</h2>
            <div class="auth-form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="officer@beacon.app" required>
            </div>
            <div class="auth-form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
            </div>
            <button class="auth-btn" onclick="handleLogin()">AUTHENTICATE ➔</button>
            <div id="loginMsg"></div>
            
            <div class="auth-link">
                Don't have an account? <a href="signup.html">Request Access</a>
            </div>
        </div>
    </div>

    <script>
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const msgDiv = document.getElementById('loginMsg');
            
            if (!email || !password) {
                msgDiv.className = 'error';
                msgDiv.innerText = 'Email and password are required.';
                return;
            }
            
            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    msgDiv.className = 'success';
                    msgDiv.innerText = 'Authentication successful. Redirecting...';
                    localStorage.setItem('beacon_token', data.access_token);
                    
                    // Route based on role
                    setTimeout(() => {
                        if (data.user.role === 'ADMIN') window.location.href = 'admin.html';
                        else if (data.user.role === 'OFFICER') window.location.href = 'officer.html';
                        else window.location.href = 'victim.html';
                    }, 1000);
                } else {
                    msgDiv.className = 'error';
                    msgDiv.innerText = data.detail || 'Login failed.';
                }
            } catch (err) {
                msgDiv.className = 'error';
                msgDiv.innerText = 'Network error occurred.';
            }
        }
    </script>
</body>
</html>
